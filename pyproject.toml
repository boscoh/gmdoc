[project]
name = "gdoc"
version = "0.1.0"
description = "Pull/push Google Docs as Markdown via the Drive API"
authors = [
    { name = "boscoh", email = "apposite@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cyclopts>=4.10.0",
]

[project.scripts]
gdoc = "gdoc:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["gdoc.py"]
